name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    # the firmware is the one piece nobody can test without hardware, so at
    # minimum prove it still compiles for the board it actually runs on, and
    # report what it costs
    name: compile for the Nano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sketch/carsensordriver

      - name: Install arduino-cli
        # the official action rather than the install script: the script
        # reads its first positional argument as a version, so passing a
        # bindir there makes it fetch arduino-cli_-b_Linux_64bit.tar.gz
        uses: arduino/setup-arduino-cli@v2

      - name: Show the version in use
        run: arduino-cli version

      - name: Install the AVR core and libraries
        # DS18B20 needs OneWire, which it does not pull in itself
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install DS18B20
          arduino-cli lib install OneWire

      - name: Install SensorHub, which supplies the shared packet format
        run: |
          # a plain checkout rather than `lib install --git-url`: that flag is
          # disabled unless library.enable_unsafe_install is turned on, so the
          # git-url path could never have been the one doing the work
          git clone --depth 1 https://github.com/HEEV/SensorHub.git \
            "$(arduino-cli config get directories.user)/libraries/SensorHub"
          # a clone can succeed while producing something Arduino cannot use,
          # so check for the entry point rather than trusting the exit status
          lib="$(arduino-cli config get directories.user)/libraries/SensorHub"
          if [ ! -f "$lib/src/SensorHub.h" ]; then
            echo "SensorHub is present but has no src/SensorHub.h."
            echo "If HEEV/SensorHub#2 has not merged yet, that is expected:"
            echo "main does not carry the library layout until it lands."
            exit 1
          fi

      - name: Compile
        run: |
          # pipefail, or tee's exit status hides a failed compile and the
          # error surfaces two steps later as a confusing empty grep
          set -o pipefail
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328 \
            --warnings all \
            sketch/carsensordriver 2>&1 | tee /tmp/build.log

      - name: Report flash and RAM use
        # a Nano has 30720 bytes of flash and 2048 of RAM. running out is a
        # real failure mode when someone adds a sensor, and it is much easier
        # to notice here than at an event.
        run: grep -E "Sketch uses|Global variables" /tmp/build.log

      - name: Fail if the sketch no longer fits with room to spare
        # 80% is the line; below that there is space for another sensor
        run: |
          used=$(grep -oE "Sketch uses [0-9]+" /tmp/build.log | grep -oE "[0-9]+")
          pct=$(( used * 100 / 30720 ))
          echo "flash: ${used} bytes, ${pct}% of a Nano"
          if [ "$pct" -ge 80 ]; then
            echo "over 80% of flash; time to think about what to cut"
            exit 1
          fi
